<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>凡人修仙传 × Codex · 概念稿2 · 青霆玄阵</title>
  <link rel="stylesheet" href="styles/mortal-seal-card.css">
  <style>
    .five-hour-concept {
      --five-hour-color: #76e6cb;
      --five-hour-glow: rgba(118, 230, 203, .42);
      --ledger-sigil-color: #71e2dc;
      --ledger-sigil-glow: rgba(113, 226, 220, .28);
      --ledger-value-color: #d5b564;
      --ledger-value-glow: rgba(213, 181, 100, .4);
    }

    .five-hour-concept .showcase-summary { letter-spacing: .22em; }
    .five-hour-concept .sync-status { color: rgba(213, 181, 100, .82); }
    .five-hour-concept .account-actions { right: 14px; }

    .five-hour-concept .ledger {
      right: 10px;
      top: 168px;
      width: 138px;
      padding: 5px 0 1px;
      overflow: hidden;
      border-color: rgba(196, 237, 221, .18);
      border-radius: 6px 17px 6px 17px;
      background:
        linear-gradient(90deg, rgba(3, 21, 22, .7) 0 32px, rgba(213, 181, 100, .12) 32px 33px, transparent 33px),
        linear-gradient(102deg, rgba(3, 16, 17, .12), rgba(8, 28, 27, .58)),
        radial-gradient(circle at 78% 22%, rgba(118, 230, 203, .08), transparent 46%);
      box-shadow:
        inset 0 1px rgba(234, 248, 238, .08),
        inset 0 0 22px rgba(118, 230, 203, .035),
        -12px 13px 30px rgba(0, 0, 0, .14);
      backdrop-filter: blur(2.4px) saturate(1.12);
    }

    .five-hour-concept .ledger-row {
      position: relative;
      display: grid;
      grid-template-columns: 33px minmax(0, 1fr);
      grid-template-rows: 15px 13px;
      row-gap: 1px;
      align-items: center;
      min-height: 33px;
      padding: 2px 8px 2px 0;
    }

    .five-hour-concept .ledger-row + .ledger-row {
      border-top: 1px solid rgba(213, 181, 100, .16);
    }

    .ledger-sigil {
      position: relative;
      grid-row: 1 / 3;
      grid-column: 1;
      justify-self: center;
      width: 18px;
      height: 18px;
      border: 1px solid color-mix(in srgb, var(--ledger-sigil-color) 58%, transparent);
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ledger-sigil-color);
      font: 8px/1 STKaiti, KaiTi, serif;
      box-shadow: 0 0 7px var(--ledger-sigil-glow), inset 0 0 7px color-mix(in srgb, var(--ledger-sigil-color) 14%, transparent);
    }

    .five-hour-concept .ledger-sigil::before {
      content: "";
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      pointer-events: none;
      border: 1px dashed color-mix(in srgb, var(--ledger-sigil-color) 46%, transparent);
      opacity: .82;
    }

    .five-hour-concept .ledger-value {
      grid-column: 2;
      align-self: end;
      justify-self: end;
      width: 100%;
      color: var(--ledger-value-color);
      font: 400 13px/15px STKaiti, KaiTi, "Bodoni 72", Didot, Georgia, serif;
      letter-spacing: .025em;
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }

    .five-hour-concept .ledger-value {
      text-shadow: 0 0 9px var(--ledger-value-glow), 0 2px 5px rgba(0, 0, 0, .8);
    }

    .five-hour-concept .ledger-reset {
      grid-column: 2;
      align-self: center;
      justify-self: end;
      width: 100%;
      color: rgba(197, 224, 213, .68);
      font: 9px/11px STKaiti, KaiTi, "Microsoft YaHei", sans-serif;
      letter-spacing: .015em;
      white-space: nowrap;
      text-align: right;
    }

    .five-hour-concept[data-five-state="warning"] {
      --five-hour-color: #efc36d;
      --five-hour-glow: rgba(239, 195, 109, .42);
    }

    .five-hour-concept[data-five-state="critical"] {
      --five-hour-color: #f18a5d;
      --five-hour-glow: rgba(241, 138, 93, .5);
    }

    .five-hour-concept[data-five-state="critical"] .ledger-row--five {
      background: linear-gradient(90deg, transparent, rgba(168, 91, 69, .08));
    }

    .concept-caption {
      display: grid;
      gap: 4px;
    }

    .concept-caption em {
      color: rgba(113, 226, 220, .62);
      font: 10px/1.4 STKaiti, KaiTi, serif;
      letter-spacing: .08em;
    }

    /* Concept 2: jade and ink glass; retain the approved geometry. */
    .five-hour-concept {
      --ledger-sigil-color: #8bcfc2;
      --ledger-sigil-glow: rgba(139, 207, 194, .15);
      --ledger-value-color: #ddc184;
      --ledger-value-glow: rgba(221, 193, 132, .13);
    }
    .five-hour-concept .ledger {
      border-color: rgba(164, 216, 201, .25);
      background:
        linear-gradient(130deg, rgba(220, 248, 235, .11), transparent 30% 68%, rgba(134, 194, 176, .045)),
        linear-gradient(90deg, rgba(5, 27, 27, .52) 0 32px, rgba(155, 204, 187, .10) 32px 33px, transparent 33px),
        linear-gradient(110deg, rgba(6, 23, 24, .48), rgba(6, 21, 22, .72));
      box-shadow: inset 0 1px 0 rgba(226, 255, 240, .18), inset 1px 0 0 rgba(193, 233, 220, .08), inset 0 -1px 0 rgba(0, 8, 10, .4), 0 5px 18px rgba(0, 9, 12, .18);
      backdrop-filter: blur(4px) saturate(1.08);
    }
    .five-hour-concept .ledger-row + .ledger-row {
      border-top-color: rgba(168, 204, 187, .10);
    }
    .five-hour-concept .ledger-reset {
      color: #b6c9bf;
      font-family: "SimSun", "Songti SC", serif;
      font-size: 9px;
      line-height: 11px;
      letter-spacing: 0;
      font-variant-numeric: lining-nums tabular-nums;
      text-shadow: 0 1px 2px rgba(0, 0, 0, .8);
    }
    .five-hour-concept .ledger-value {
      text-shadow: 0 1px 3px rgba(0, 0, 0, .65);
    }
    .five-hour-concept .ledger-sigil::before { opacity: .58; }
    .five-hour-concept .seal-card {
      --formation-primary: #8bcfc2;
      --formation-secondary: #529f94;
    }
    .five-hour-concept .formation-foundation {
      mask-image: radial-gradient(ellipse, rgba(0,0,0,.23) 0 24%, rgba(0,0,0,.65) 46%, #000 70%);
    }
    .five-hour-concept .formation-radiance { opacity: .65; }
    .five-hour-concept .quota-eye strong {
      background-image: linear-gradient(180deg, #d4ece0 10%, #8bcfc2 63%, #b9c8a0 100%);
      -webkit-text-stroke: .2px rgba(40, 92, 83, .45);
      text-shadow: 0 1px 3px rgba(0, 12, 14, .65), 0 0 5px rgba(139, 207, 194, .18);
      animation: none;
    }
    .five-hour-concept .portrait-base::after {
      content: "";
      position: absolute;
      inset: 0;
      background: inherit;
      filter: brightness(1.17);
      mask-image: radial-gradient(ellipse 17% 25% at 49% 45%, #000, transparent), radial-gradient(ellipse 12% 23% at 65% 55%, #000, transparent);
    }

/* Reference-led energy field: no physical swords; bright perimeter, quiet core. */
.five-hour-concept .qi-array { width:100%;height:100%;overflow:visible; }
.five-hour-concept .formation { opacity:.95; }
.qi-stream { animation:qiFlow var(--flow) linear infinite; animation-delay:var(--offset); }
.qi-lightning { animation:qiThunder 6s ease-in-out infinite; opacity:.6; }
@keyframes qiFlow { to { stroke-dashoffset:-500; } }
@keyframes qiThunder { 0%,100% {opacity:.2} 35% {opacity:.8} 65% {opacity:.4} }
@media(prefers-reduced-motion:reduce) { .qi-stream,.qi-lightning {animation:none;} }
</style>
</head>

            <div class="motto">念头通达 · 炖煮红尘</div>
          </article>
        </div>
        <p class="size-mark">480 × 270 · 概念稿2 · 青霆玄阵</p>
      </div>

      <div class="demo-console" aria-label="五小时额度状态演示">
        <div class="console-copy concept-caption">
          <span>五时副印</span>
          <strong>七日主阵保持不动，短周期额度只改变右侧副印</strong>
          <em>青玉充盈 · 金焰临界 · 赤焰告急</em>
        </div>
        <div class="state-buttons">
          <button class="active" type="button" data-five="94" data-state="full" aria-pressed="true">五时 94%</button>
          <button type="button" data-five="42" data-state="warning" aria-pressed="false">五时 42%</button>
          <button type="button" data-five="16" data-state="critical" aria-pressed="false">五时 16%</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const concept = document.querySelector('#concept');
    const fiveHour = document.querySelector('#fiveHourPercent');
    const fiveHourReset = document.querySelector('#fiveHourReset');
    const buttons = [...document.querySelectorAll('[data-five]')];
    const resetMinutes = { full: 131, warning: 63, critical: 18 };

    function formatResetTime(minutesFromNow) {
      const resetAt = new Date(Date.now() + minutesFromNow * 60_000);
      const month = resetAt.getMonth() + 1;
      const day = resetAt.getDate();
      const hour = String(resetAt.getHours()).padStart(2, '0');
      const minute = String(resetAt.getMinutes()).padStart(2, '0');
      return `${month}月${day}日 ${hour}:${minute} 重置`;
    }

    fiveHourReset.textContent = formatResetTime(resetMinutes.full);

    buttons.forEach((button) => {
      button.addEventListener('click', () => {
        const state = button.dataset.state;
        concept.dataset.fiveState = state;
        fiveHour.textContent = `余${button.dataset.five}%`;
        fiveHourReset.textContent = formatResetTime(resetMinutes[state]);
        buttons.forEach((item) => {
          const active = item === button;
          item.classList.toggle('active', active);
          item.setAttribute('aria-pressed', String(active));
        });
      });
    });
  </script>
</body>
</html>
