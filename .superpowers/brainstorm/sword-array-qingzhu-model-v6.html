  <script>
    const orbit=document.querySelector('#orbit');
    const buttons=[...document.querySelectorAll('[data-remain]')];
    function render(remain){
      const count=Math.max(1,Math.round(remain/10)); orbit.replaceChildren();
      for(let i=0;i<count;i++){
        const sword=document.createElement('i');
        const angle=i*360/count;
        const rad=(angle-90)*Math.PI/180;
        const phaseY=Math.sin(rad);
        const phaseX=Math.cos(rad);
        const tilt=Math.round(phaseX*18);
        const pitch=Math.round(54-phaseY*24);
        const sweep=Math.round(-phaseX*13);
        const zscale=(.76+Math.max(0,phaseY)*.26-Math.max(0,-phaseY)*.13).toFixed(2);
        const rise=Math.round(phaseY*8);
        const depthClass=phaseY>.38?'sword-depth-front':(phaseY<-.34?'sword-depth-back':'sword-depth-mid');
        sword.className='sword '+depthClass;
        sword.style.setProperty('--a',angle+'deg');
        sword.style.setProperty('--tilt',tilt+'deg');
        sword.style.setProperty('--pitch',pitch+'deg');
        sword.style.setProperty('--sweep',sweep+'deg');
        sword.style.setProperty('--zscale',zscale);
        sword.style.setProperty('--rise',rise+'px');
        const stance=document.createElement('span');stance.className='sword-stance';
        const ghost=document.createElement('i');ghost.className='sword-tail-ghost';
        const shadow=document.createElement('i');shadow.className='sword-floor-shadow';
        const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.className='qingzhu-sword';svg.setAttribute('class','qingzhu-sword');svg.setAttribute('viewBox','0 0 38 124');
        const use=document.createElementNS('http://www.w3.org/2000/svg','use');use.setAttribute('href','#qingzhu-sword-glyph');svg.append(use);stance.append(ghost,shadow,svg);sword.append(stance);orbit.append(sword)
      }      document.querySelector('#percent').textContent=`${remain}%`;document.querySelector('#used').textContent=`?? ${100-remain}%`;document.querySelector('#count').textContent=`${count}?`;document.querySelector('#gap').textContent=`${Math.round(360/count)}?`;
      buttons.forEach(button=>button.classList.toggle('active',Number(button.dataset.remain)===remain));
    }
    buttons.forEach(button=>button.addEventListener('click',()=>render(Number(button.dataset.remain))));render(80);
  </script>
