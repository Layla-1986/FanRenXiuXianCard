<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>墨海剑墟 · 法宝封印图卷</title>
  <link rel="stylesheet" href="styles/mortal-seal-card.css">
  <script src="scripts/quota-card.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="showcase-intro">
      <p class="showcase-kicker">CODEX · 灵力法器</p>
      <h1>墨海剑墟</h1>
      <p class="showcase-summary">阵守余量，道在人心；一念通达，亦可炖煮红尘。</p>
    </header>

    <section class="showcase" aria-labelledby="showcaseTitle">
      <h2 class="visually-hidden" id="showcaseTitle">凡人修仙主题 Codex 用量悬浮卡片</h2>

      <div class="display-stage">
        <div class="stage-halo" aria-hidden="true"></div>
        <div class="stage-card">
          <article class="seal-card" id="widget" style="--used: .2" data-used-state="calm" aria-label="Codex 用量法宝封印图卷">
            <div class="portrait-scene" aria-hidden="true"></div>
            <div class="scene-veil" aria-hidden="true"></div>
            <div class="scene-mist scene-mist--one" aria-hidden="true"></div>
            <div class="scene-mist scene-mist--two" aria-hidden="true"></div>

            <header class="card-mark">
              <div class="account-mark">
                <span class="account-name">眭劳模的 Codex</span>
                <span class="account-caption">元婴灵府 · 法宝封印</span>
              </div>
              <div class="account-actions">
                <span class="plan-mark">PLUS</span>
                <button class="seal-lock" id="unlockButton" type="button" aria-label="解锁悬浮窗" aria-pressed="false">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path class="lock-shackle" d="M7.5 10V7.4a4.5 4.5 0 0 1 9 0V10" />
                    <path d="M6.2 10h11.6v9H6.2z" />
                    <path d="M12 13.1v3" />
                  </svg>
                </button>
              </div>
            </header>

            <div class="seal-formation" aria-hidden="true">
              <div class="formation-plane">
                <i class="formation-ring formation-ring--outer"></i>
                <i class="formation-ring formation-ring--middle"></i>
                <i class="formation-ring formation-ring--inner"></i>
                <i class="formation-axis formation-axis--one"></i>
                <i class="formation-axis formation-axis--two"></i>
                <div class="formation-runes">
                  <b>临</b><b>兵</b><b>斗</b><b>者</b><b>皆</b><b>阵</b><b>列</b><b>前</b>
                </div>
                <div class="formation-swords formation-swords--lower-arc">
                  <i class="formation-sword" data-sword-index="0" style="--angle: 82deg; --radius: 61px; --delay: .04s"></i>
                  <i class="formation-sword" data-sword-index="1" style="--angle: 100deg; --radius: 67px; --delay: .09s"></i>
                  <i class="formation-sword" data-sword-index="2" style="--angle: 118deg; --radius: 63px; --delay: .14s"></i>
                  <i class="formation-sword" data-sword-index="3" style="--angle: 136deg; --radius: 69px; --delay: .19s"></i>
                  <i class="formation-sword" data-sword-index="4" style="--angle: 154deg; --radius: 64px; --delay: .24s"></i>
                  <i class="formation-sword" data-sword-index="5" style="--angle: 172deg; --radius: 68px; --delay: .29s"></i>
                  <i class="formation-sword" data-sword-index="6" style="--angle: 188deg; --radius: 62px; --delay: .34s"></i>
                  <i class="formation-sword" data-sword-index="7" style="--angle: 206deg; --radius: 66px; --delay: .39s"></i>
                  <i class="formation-sword" data-sword-index="8" style="--angle: 224deg; --radius: 63px; --delay: .44s"></i>
                  <i class="formation-sword" data-sword-index="9" style="--angle: 242deg; --radius: 69px; --delay: .49s"></i>
                  <i class="formation-sword" data-sword-index="10" style="--angle: 260deg; --radius: 64px; --delay: .54s"></i>
                  <i class="formation-sword" data-sword-index="11" style="--angle: 278deg; --radius: 68px; --delay: .59s"></i>
                </div>
              </div>
              <i class="formation-core"></i>
              <i class="stray-sword stray-sword--one"></i>
              <i class="stray-sword stray-sword--two"></i>
              <i class="stray-sword stray-sword--three"></i>
            </div>

            <section class="quota-eye" aria-label="七日额度余量">
              <span class="quota-aura" aria-hidden="true"></span>
              <strong id="percent">80%</strong>
            </section>

            <section class="quota-ledger" aria-label="额度状态">
              <div class="ledger-item ledger-item--cycle">
                <span class="ledger-kicker">本周期消耗</span>
                <strong id="used">已用 20%</strong>
                <span class="ledger-note">8月4日 18:30 重置</span>
              </div>
              <i class="ledger-divider" aria-hidden="true"></i>
              <div class="ledger-item ledger-item--balance">
                <span class="ledger-kicker">当前余额</span>
                <strong id="balance">US$39.36</strong>
              </div>
            </section>

            <footer class="card-foot">
              <span class="mortal-motto">念头通达</span>
              <span class="mortal-motto">炖煮红尘</span>
            </footer>
          </article>
        </div>
        <p class="size-mark">480 × 270 · 桌面卡片屏实寸构图</p>
      </div>

      <div class="demo-console" aria-label="额度状态演示">
        <div class="console-copy">
          <span>灵力推演</span>
          <strong>剑位会随周期消耗渐次隐入阵中</strong>
        </div>
        <div class="state-buttons">
          <button class="active" type="button" data-used=".2" aria-pressed="true">已用 20%</button>
          <button type="button" data-used=".55" aria-pressed="false">已用 55%</button>
          <button type="button" data-used=".85" aria-pressed="false">已用 85%</button>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
