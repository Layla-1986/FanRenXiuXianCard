.seal-lock {
  position: relative;
  display: grid;
  place-items: center;
  width: 28px;
  height: 28px;
  padding: 0;
  border: 1px solid rgba(213, 181, 100, .48);
  border-radius: 50%;
  color: var(--ward-gold);
  background: rgba(4, 20, 22, .56);
  box-shadow: inset 0 0 10px rgba(213, 181, 100, .05), 0 0 12px rgba(0, 0, 0, .24);
  cursor: pointer;
  transition: color .3s ease, border-color .3s ease, background .3s ease;
}

.seal-lock::after {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(113, 226, 220, .12);
  border-radius: 50%;
}

.seal-lock svg {
  position: relative;
  z-index: 1;
  width: 14px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.5;
  stroke-linecap: round;
  stroke-linejoin: round;
}

.seal-lock.is-unlocked,
.seal-lock[aria-pressed="true"] {
  color: var(--nascent-cyan);
  border-color: rgba(113, 226, 220, .66);
  background: rgba(21, 71, 64, .54);
}

.seal-lock.is-unlocked .lock-shackle {
  transform: translateX(3px) rotate(23deg);
  transform-origin: 8px 10px;
}

.seal-lock:focus-visible {
  outline: 2px solid var(--moon-white);
  outline-offset: 2px;
}

.antigravity-seal {
  position: relative;
  display: grid;
  place-items: center;
  width: 24px;
  height: 24px;
  padding: 0;
  border: 1px solid rgba(159, 133, 220, .5);
  border-radius: 7px 2px 7px 2px;
  color: rgba(215, 197, 255, .86);
  background: rgba(17, 16, 43, .62);
  box-shadow: inset 0 0 9px rgba(137, 103, 215, .12);
  cursor: pointer;
  transition: color .24s ease, border-color .24s ease, background .24s ease, transform .24s ease;
}

.antigravity-seal::before {
  content: "";
  position: absolute;
  inset: 3px;
  border: 1px solid rgba(113, 226, 220, .13);
  border-radius: 4px 1px 4px 1px;
}

.antigravity-seal span {
  position: relative;
  z-index: 1;
  font-family: STKaiti, KaiTi, serif;
  font-size: 12px;
}

.antigravity-seal:hover,
.antigravity-seal[aria-pressed="true"] {
  color: #f0e9ff;
  border-color: rgba(189, 163, 247, .85);
  background: rgba(78, 54, 131, .72);
  transform: translateY(-1px);
}

.antigravity-seal:focus-visible {
  outline: 2px solid var(--moon-white);
  outline-offset: 2px;
}
